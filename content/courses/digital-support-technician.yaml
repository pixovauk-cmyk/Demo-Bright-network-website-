title: Digital Support Technician
level: "3"
sector: tech
duration: 12 months
tagline: Be the person every organisation depends on for tech
description: Gain the skills to support users, maintain systems, and drive digital adoption across any business. From first-line IT support to building internal tooling. This programme builds versatile digital technicians.
heroImage: https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=1200&q=80
featured: true
whatYouLearn:
  - Diagnose and resolve first and second-line IT issues
  - Support cloud platforms including Microsoft 365 and Google Workspace
  - Train non-technical staff on digital tools
  - Manage hardware, software, and network assets
  - Document processes and build user guides
  - Apply data protection best practices daily
employerBenefits:
  - Fastest-to-qualify tech programme at just 12 months
  - Immediately productive. Skills applied from week one.
  - Reduces IT support costs and third-party helpdesk reliance
  - Build internal digital champions across your organisation
