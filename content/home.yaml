dualHeadline: "Two audiences. One thing in common. Neither of you pays a penny."
dualSubtext: "Whether you're building a team or starting a career — the government funds it. We deliver it."
employerCardHeadline: "Your next hire could cost you nothing. We'll make sure of it."
employerCardSubtext: "We write the job advert, screen the candidates, run the programme, and track progress. You meet the shortlist, choose your hire, and watch them grow. It costs most employers nothing."
employerCardImage: "https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=900&q=85"
employerBullets:
  - "Fully funded — 95 to 100% covered by government"
  - "One named account manager. Direct number. No call queues."
  - "Live progress dashboard — see exactly where each learner stands"
  - "Ofsted Good delivery — independently verified, not self-certified"
learnerCardHeadline: "Get paid. Get qualified. No debt. No fees."
learnerCardSubtext: "A real salary from day one. A nationally recognised qualification at the end. And real experience with a real employer throughout. You don't have to choose between earning and learning."
learnerCardImage: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=900&q=85"
