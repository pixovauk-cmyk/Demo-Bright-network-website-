features:
  - title: "Total Programme Delivery"
    desc: "From job advert to qualification. We manage the entire process so your team focuses on the business, not the admin."
  - title: "Named Account Manager"
    desc: "A dedicated person who knows your organisation. Direct contact, no ticketing systems, no call queues."
  - title: "Tailored Programmes"
    desc: "Every programme is shaped around your culture and objectives. Not an off-the-shelf package that barely fits."
  - title: "Measurable ROI"
    desc: "Our employer partners report a 30% average attrition reduction within 12 months. Numbers that matter at board level."

howHeadline: "From first call to qualified team member"
howImage: "https://images.unsplash.com/photo-1531482615713-2afd69097998?w=900&q=85"
steps:
  - title: "Free Skills Audit"
    desc: "We identify gaps in your team and map them to the right apprenticeship frameworks. No obligation, no sales pressure."
  - title: "Programme Design"
    desc: "We tailor content, delivery schedule, and assessment to fit your organisation. Not the other way around."
  - title: "We Handle Recruitment"
    desc: "Free job advertising, screening, and interview coordination. Qualified candidates delivered to your door."
  - title: "Live Progress Tracking"
    desc: "Your employer portal shows milestones, attendance, and qualification progress in real time."

