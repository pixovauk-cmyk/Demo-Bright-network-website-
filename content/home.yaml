whyHeadline: "Thirty years of delivery. Three Ofsted Good providers. One team looking after you."
whySubtext: "We've been training people across the UK since 1995. Our platform brings that expertise online — so learners can study anywhere, and employers can track progress in real time."
whyImage1: "https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=700&q=85"
whyImage2: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=220&q=85"
features:
  - title: "Three brands. Each independently Ofsted Good."
    desc: "Workpays, WS Training, and Orangebox — three separate Ofsted inspections, three Good ratings. That's not a marketing claim. That's an independent judgement on the quality of what we deliver."
  - title: "11,000 people chose us this year. Here's why."
    desc: "Fifteen offices. Derby to Hartlepool. Large enough to place learners with leading national employers, and local enough to know the businesses in your area personally."
  - title: "One tutor. Your tutor."
    desc: "From your first session to your end point assessment — the same person, every step. No handoffs, no call centres."
  - title: "Three decades. We've seen every funding change."
    desc: "Founded in 1995. Every funding model, every Ofsted framework overhauled. We adapted every time — because the employers and learners we work with needed us to."

howHeadline: "Four steps. Start today. Qualified within months."
howImage: "https://images.unsplash.com/photo-1531482615713-2afd69097998?w=900&q=85"
steps:
  - title: "A free call that changes everything"
    desc: "Twenty minutes. That's all it takes. You tell us what you're looking for — whether you want to upskill your team or start a career. We tell you exactly which funded programmes apply. No pressure. No pitch."
  - title: "We handle the paperwork so you don't have to"
    desc: "Eligibility checks, employer agreements, funding applications — we do all of it. You focus on showing up. We handle everything else."
  - title: "Study around your life, not the other way round"
    desc: "Your personal learning hub is available whenever you are. Lessons, live sessions, and regular tutor check-ins built around your schedule — not the other way round."
  - title: "Collect your qualification. Then keep going."
    desc: "Pass your End Point Assessment and you leave with a nationally recognised qualification in your name. Most learners don't stop there — many go straight into Level 4 or 5, or into a permanent role."

